[alias]
	# Check out a pull request branch in a dedicated worktree.
	# Usage: git checkout-pr <pr-number> [worktree-path]
	checkout-pr = "!f() {\n  pr=\"$1\";\n  path=\"$2\";\n\n  if [ -z \"$pr\" ]; then\n    echo \"usage: git checkout-pr <pr-number> [worktree-path]\" >&2;\n    return 1;\n  fi;\n\n  # repo info\n  repoRoot=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || return 1;\n  repoName=\"$(basename \"$repoRoot\")\";\n\n  # default worktree path: {repoName}-pr-{pr}\n  if [ -z \"$path\" ]; then\n    path=\"../${repoName}-pr-$pr\";\n  fi;\n\n  # normalize to absolute path\n  absPath=\"$(cd \"$(dirname \"$path\")\" 2>/dev/null && pwd)/$(basename \"$path\")\" || return 1;\n\n  # PR head branch name (e.g. create-@theriety/push-notification-package)\n  headRef=\"$(gh pr view \"$pr\" --json headRefName --jq .headRefName)\" || return 1;\n\n  branch=\"\";\n\n  # 🔹 First try: real PR branch on origin (best case, pushable)\n  if git fetch origin \"$headRef\" >/dev/null 2>&1; then\n    # create local branch tracking origin/headRef if it doesnt exist yet\n    if ! git show-ref --verify --quiet \"refs/heads/$headRef\"; then\n      git branch \"$headRef\" \"origin/$headRef\" || return 1;\n    fi;\n    branch=\"$headRef\";\n  else\n    # 🔹 Fallback: use PR ref (works for forks / weird cases, but not push-friendly)\n    branch=\"pr-$pr\";\n    git fetch origin \"refs/pull/$pr/head:refs/heads/$branch\" --force || return 1;\n  fi;\n\n  # create worktree only if it does not already exist at absPath\n  if ! git worktree list --porcelain | awk \"/^worktree /{print substr(\\$0,10)}\" | grep -Fxq \"$absPath\"; then\n    git worktree add \"$absPath\" \"$branch\" || return 1;\n  fi;\n\n  # print path so your shell wrapper can cd into it\n  echo \"$absPath\";\n}; f"
