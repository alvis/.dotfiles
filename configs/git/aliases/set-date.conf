[alias]
	# Set unpushed commits' committer dates to their author dates.
	# Usage: git set-date
	set-date = "!sha=''; for commit_hash in $(git log --pretty=format:%H origin/master..HEAD); do commit_info=$(git log -n1 --date=iso-strict --pretty=format:'%H %ad %cd' $commit_hash); author_date=$(echo $commit_info | awk '{print $2}'); committer_date=$(echo $commit_info | awk '{print $3}'); if [ \"$author_date\" != \"$committer_date\" ]; then sha=$commit_hash && echo $author_date && echo $commit_info && echo $committer_date; break; fi; done; if [ \"$sha\" != '' ]; then N=$(git rev-list --count $sha^..HEAD) && git-redate -c $N && git rebase --committer-date-is-author-date $sha^; else echo \"No commits with different author and committer dates found\"; fi"
