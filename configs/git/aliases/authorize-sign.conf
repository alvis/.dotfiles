[alias]
	# Temporarily cache the configured GPG signing key for a parsed duration.
	# Usage: git authorize-sign [<seconds|NdNhNmNs>]
	#        git authorize-sign stop
	#        The default duration is 1h.
	authorize-sign = "!authorize_sign() {\n    if [ \"$#\" -gt 1 ]; then\n        echo \"Usage: git authorize-sign [<seconds|NdNhNmNs> | stop]\" >&2\n        return 1\n    fi\n\n    interval=${1:-1h}\n    if [ \"$interval\" != stop ]; then\n        seconds=$(printf '%s\\n' \"$interval\" | awk '\n            function invalid() { exit 1 }\n            {\n                total = 0\n                if ($0 ~ /^[0-9]+$/) {\n                    total = $0 + 0\n                } else {\n                    rest = $0\n                    while (length(rest) > 0) {\n                        if (match(rest, /^[0-9]+[dhms]/) == 0) invalid()\n                        token = substr(rest, RSTART, RLENGTH)\n                        amount = substr(token, 1, length(token) - 1) + 0\n                        unit = substr(token, length(token), 1)\n                        if (unit == \"d\") total += amount * 86400\n                        else if (unit == \"h\") total += amount * 3600\n                        else if (unit == \"m\") total += amount * 60\n                        else total += amount\n                        rest = substr(rest, RSTART + RLENGTH)\n                    }\n                }\n                if (total < 1 || total > 31536000) invalid()\n                printf \"%.0f\\n\", total\n            }\n        ') || {\n            echo \"Invalid interval: $interval. Use seconds or a combination of d, h, m, and s (for example 60, 1m, 1h1m, or 2d; maximum 1 year).\" >&2\n            return 1\n        }\n    fi\n\n    gnupg_home=${GNUPGHOME:-$HOME/.gnupg}\n    timer_file=$gnupg_home/authorize-sign.timer\n    umask 077\n\n    signing_key=$(git config --get user.signingkey 2>/dev/null || :)\n    if [ -n \"$signing_key\" ]; then\n        secret_keys=$(gpg --with-keygrip --with-colons --list-secret-keys \"$signing_key\" 2>/dev/null)\n    else\n        secret_keys=$(gpg --with-keygrip --with-colons --list-secret-keys 2>/dev/null)\n    fi\n    keygrips=$(printf '%s\\n' \"$secret_keys\" | awk -F: '\n        ($1 == \"sec\" || $1 == \"ssb\") {\n            signing = index($12, \"s\") != 0\n            next\n        }\n        $1 == \"grp\" {\n            if (signing) print $10\n            signing = 0\n        }\n    ')\n    if [ -z \"$keygrips\" ]; then\n        echo \"No secret signing key found.\" >&2\n        if [ -n \"$signing_key\" ]; then\n            echo \"Could not resolve user.signingkey=$signing_key.\" >&2\n        fi\n        return 1\n    fi\n\n    old_timer_pid=$(sed -n 2p \"$timer_file\" 2>/dev/null || :)\n    case \"$old_timer_pid\" in\n        '' | *[!0-9]*) ;;\n        *) kill \"$old_timer_pid\" 2>/dev/null || : ;;\n    esac\n    rm -f \"$timer_file\"\n\n    if [ \"$interval\" = stop ]; then\n        status=0\n        for keygrip in $keygrips; do\n            response=$(gpg-connect-agent \"CLEAR_PASSPHRASE $keygrip\" /bye 2>&1) || status=1\n            if ! printf '%s\\n' \"$response\" | grep -q '^OK'; then\n                printf '%s\\n' \"$response\" >&2\n                status=1\n            fi\n        done\n        [ \"$status\" -eq 0 ] && echo \"GPG signing authorization cleared.\"\n        return \"$status\"\n    fi\n\n    if ! gpgconf --reload gpg-agent >/dev/null 2>&1; then\n        echo \"Warning: could not reload gpg-agent; using its current runtime configuration.\" >&2\n    fi\n\n    preset_program=$(command -v gpg-preset-passphrase 2>/dev/null || :)\n    if [ -z \"$preset_program\" ]; then\n        libexec_dir=$(gpgconf --list-dirs libexecdir 2>/dev/null)\n        libexec_dir=${libexec_dir#libexecdir:}\n        preset_program=$libexec_dir/gpg-preset-passphrase\n    fi\n    if [ ! -x \"$preset_program\" ]; then\n        echo \"Could not find gpg-preset-passphrase in GnuPG's libexec directory.\" >&2\n        return 1\n    fi\n\n    for keygrip in $keygrips; do\n        response=$(gpg-connect-agent \"CLEAR_PASSPHRASE $keygrip\" /bye 2>&1)\n        response_status=$?\n        if [ \"$response_status\" -ne 0 ] || ! printf '%s\\n' \"$response\" | grep -q '^OK'; then\n            printf '%s\\n' \"$response\" >&2\n            echo \"GPG agent could not clear the existing signing authorization.\" >&2\n            return 1\n        fi\n    done\n\n    # GnuPG 2.5 requires PRESET_PASSPHRASE data. Ask through the agent's\n    # configured pinentry, decode the Assuan data line, and keep it out of argv.\n    passphrase=$(gpg-connect-agent --decode \\\n        \"GET_PASSPHRASE --data X X GPG+passphrase Authorize+Git+commit+signing+for+$interval\" \\\n        /bye 2>/dev/null | awk '\n            /^D($| )/ {\n                print substr($0, 3)\n                found = 1\n            }\n            END { if (!found) exit 1 }\n        '\n    ) || {\n        echo \"GPG passphrase entry was cancelled or failed.\" >&2\n        return 1\n    }\n\n    authorized=\n    for keygrip in $keygrips; do\n        if ! printf '%s\\n' \"$passphrase\" | \"$preset_program\" --preset \"$keygrip\" >/dev/null 2>&1; then\n            unset passphrase\n            for authorized_keygrip in $authorized; do\n                gpg-connect-agent \"CLEAR_PASSPHRASE $authorized_keygrip\" /bye >/dev/null 2>&1 || :\n            done\n            echo \"GPG agent rejected passphrase presetting; run the dotfiles setup to enable allow-preset-passphrase.\" >&2\n            return 1\n        fi\n        authorized=\"$authorized $keygrip\"\n    done\n    unset passphrase\n\n    signature_status=0\n    if [ -n \"$signing_key\" ]; then\n        gpg --batch --yes --no-tty --pinentry-mode cancel --local-user \"$signing_key\" \\\n            --output /dev/null --detach-sign /dev/null >/dev/null 2>&1 || signature_status=$?\n    else\n        gpg --batch --yes --no-tty --pinentry-mode cancel \\\n            --output /dev/null --detach-sign /dev/null >/dev/null 2>&1 || signature_status=$?\n    fi\n    if [ \"$signature_status\" -ne 0 ]; then\n        for authorized_keygrip in $authorized; do\n            gpg-connect-agent \"CLEAR_PASSPHRASE $authorized_keygrip\" /bye >/dev/null 2>&1 || :\n        done\n        echo \"The passphrase did not unlock the configured signing key; authorization was cleared.\" >&2\n        return 1\n    fi\n\n    timer_token=$(date +%s).$$\n    if ! printf '%s\\n' \"$timer_token\" >\"$timer_file\"; then\n        echo \"Could not create the signing authorization timer.\" >&2\n        for authorized_keygrip in $authorized; do\n            gpg-connect-agent \"CLEAR_PASSPHRASE $authorized_keygrip\" /bye >/dev/null 2>&1 || :\n        done\n        return 1\n    fi\n\n    # The single-quoted script is evaluated by the detached shell.\n    # shellcheck disable=SC2016\n    nohup sh -c '\n        interval_seconds=$1\n        timer_token=$2\n        timer_file=$3\n        keygrips=$4\n        sleep \"$interval_seconds\"\n        if [ \"$(sed -n 1p \"$timer_file\" 2>/dev/null)\" = \"$timer_token\" ]; then\n            status=0\n            for keygrip in $keygrips; do\n                response=$(gpg-connect-agent \"CLEAR_PASSPHRASE $keygrip\" /bye 2>&1)\n                response_status=$?\n                if [ \"$response_status\" -ne 0 ] || ! printf \"%s\\n\" \"$response\" | grep -q \"^OK\"; then\n                    status=1\n                fi\n            done\n            rm -f \"$timer_file\"\n            exit \"$status\"\n        fi\n    ' authorize-sign-timer \"$seconds\" \"$timer_token\" \"$timer_file\" \"$authorized\" \\\n        >/dev/null 2>&1 </dev/null &\n    timer_pid=$!\n    if ! printf '%s\\n%s\\n' \"$timer_token\" \"$timer_pid\" >\"$timer_file\"; then\n        kill \"$timer_pid\" 2>/dev/null || :\n        rm -f \"$timer_file\"\n        for authorized_keygrip in $authorized; do\n            gpg-connect-agent \"CLEAR_PASSPHRASE $authorized_keygrip\" /bye >/dev/null 2>&1 || :\n        done\n        echo \"Could not record the signing authorization timer.\" >&2\n        return 1\n    fi\n\n    echo \"GPG signing authorized for $interval ($seconds seconds).\"\n}\n\nauthorize_sign"
