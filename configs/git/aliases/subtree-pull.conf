[alias]
	# Pull updates from a subtree's remembered remote and branch.
	# Usage: git subtree-pull <prefix>
	subtree-pull = "!f() {\n  if [ \"$#\" -ne 1 ]; then\n    echo \"Usage: git subtree-pull <prefix>\" >&2;\n    return 1;\n  fi;\n\n  prefix=\"$1\";\n  remote=\"$(git config --get \"subtree.$prefix.remote\")\";\n  branch=\"$(git config --get \"subtree.$prefix.branch\")\";\n  if [ -z \"$remote\" ] || [ -z \"$branch\" ]; then\n    echo \"No remote and branch are configured for subtree \\\"$prefix\\\".\" >&2;\n    echo \"Run git subtree-add, or configure subtree.$prefix.remote and subtree.$prefix.branch.\" >&2;\n    return 1;\n  fi;\n\n  git subtree pull --prefix=\"$prefix\" \"$remote\" \"$branch\";\n}; f"
