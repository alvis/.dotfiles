[alias]
	# Add a repository as a subtree and remember its remote and branch.
	# Usage: git subtree-add <prefix> <repository> [branch]
	subtree-add = "!f() {\n  if [ \"$#\" -lt 2 ] || [ \"$#\" -gt 3 ]; then\n    echo \"Usage: git subtree-add <prefix> <repository> [branch]\" >&2;\n    return 1;\n  fi;\n\n  prefix=\"$1\";\n  repository=\"$2\";\n  branch=\"${3:-main}\";\n  remote=\"${prefix}-upstream\";\n\n  git check-ref-format \"refs/remotes/$remote/placeholder\" >/dev/null || {\n    echo \"Prefix produces an invalid remote name: $remote\" >&2;\n    return 1;\n  };\n  if git remote get-url \"$remote\" >/dev/null 2>&1; then\n    echo \"Remote \\\"$remote\\\" already exists.\" >&2;\n    return 1;\n  fi;\n\n  git remote add \"$remote\" \"$repository\" || return 1;\n  if ! git subtree add --prefix=\"$prefix\" \"$remote\" \"$branch\"; then\n    git remote remove \"$remote\";\n    return 1;\n  fi;\n\n  git config \"subtree.$prefix.remote\" \"$remote\" || return 1;\n  git config \"subtree.$prefix.branch\" \"$branch\";\n}; f"
