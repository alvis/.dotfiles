[alias]
	# Push the current branch to a remote and set it as the upstream.
	# Usage: git branch-push [remote]
	branch-push = "!f() {\n  if [ \"$#\" -gt 1 ]; then\n    echo \"Usage: git branch-push [remote]\" >&2;\n    return 1;\n  fi;\n\n  remote=\"${1:-origin}\";\n  branch=\"$(git symbolic-ref --quiet --short HEAD)\" || {\n    echo \"Cannot push a branch while HEAD is detached.\" >&2;\n    return 1;\n  };\n\n  git push --set-upstream \"$remote\" \"$branch\";\n}; f"
