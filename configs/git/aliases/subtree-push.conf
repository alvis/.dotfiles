[alias]
	# Split and push a subtree after rebasing it onto its remembered remote branch.
	# Optional commit options create an empty commit on the split branch before pushing.
	# Usage: git subtree-push <prefix> [commit-options]
	subtree-push = "!f() {\n  if [ \"$#\" -lt 1 ]; then\n    echo \"Usage: git subtree-push <prefix> [commit-options]\" >&2;\n    return 1;\n  fi;\n\n  prefix=\"$1\";\n  shift;\n  if [ ! -d \"$prefix\" ]; then\n    echo \"Subtree prefix is not a directory: $prefix\" >&2;\n    return 1;\n  fi;\n\n  remote=\"$(git config --get \"subtree.$prefix.remote\")\";\n  [ -n \"$remote\" ] || remote=origin;\n  branch=\"$(git config --get \"subtree.$prefix.branch\")\";\n  if [ -z \"$branch\" ]; then\n    remote_head=\"$(git symbolic-ref --quiet --short \"refs/remotes/$remote/HEAD\")\";\n    branch=\"${remote_head#\"$remote/\"}\";\n    if [ -z \"$remote_head\" ] || [ \"$branch\" = \"$remote_head\" ]; then\n      echo \"No branch is configured for subtree \\\"$prefix\\\".\" >&2;\n      echo \"Configure subtree.$prefix.branch before pushing.\" >&2;\n      return 1;\n    fi;\n  fi;\n  git check-ref-format --branch \"$branch\" >/dev/null || return 1;\n\n  original=\"$(git symbolic-ref --quiet --short HEAD)\" || {\n    echo \"Cannot push a subtree while HEAD is detached.\" >&2;\n    return 1;\n  };\n  if ! git diff --quiet || ! git diff --cached --quiet; then\n    echo \"Commit or stash tracked changes before pushing a subtree.\" >&2;\n    return 1;\n  fi;\n\n  rebase_merge=\"$(git rev-parse --git-path rebase-merge)\";\n  rebase_apply=\"$(git rev-parse --git-path rebase-apply)\";\n  if [ -d \"$rebase_merge\" ] || [ -d \"$rebase_apply\" ]; then\n    echo \"Finish the current rebase before pushing a subtree.\" >&2;\n    return 1;\n  fi;\n\n  temporary=\"push-subtree-$(date +%s)-$$\";\n  cleanup() {\n    status=\"$1\";\n    trap - 0 1 2 15;\n    if [ -d \"$rebase_merge\" ] || [ -d \"$rebase_apply\" ]; then\n      git rebase --abort >/dev/null 2>&1 || status=1;\n    fi;\n    checked_out=\"$(git symbolic-ref --quiet --short HEAD 2>/dev/null)\";\n    if [ \"$checked_out\" != \"$original\" ]; then\n      git checkout \"$original\" >/dev/null 2>&1 || status=1;\n    fi;\n    if git show-ref --verify --quiet \"refs/heads/$temporary\"; then\n      git branch -D \"$temporary\" >/dev/null 2>&1 || status=1;\n    fi;\n    return \"$status\";\n  };\n  trap 'cleanup $?' 0;\n  trap 'cleanup 130; exit 130' 1 2 15;\n\n  git subtree split --prefix=\"$prefix\" --branch=\"$temporary\" || return 1;\n  git checkout \"$temporary\" >/dev/null 2>&1 || return 1;\n  if [ \"$#\" -gt 0 ]; then\n    git commit --allow-empty \"$@\" || return 1;\n  fi;\n  git fetch \"$remote\" \"$branch\" || return 1;\n  git rebase FETCH_HEAD || return 1;\n  git push \"$remote\" \"$temporary:refs/heads/$branch\" || return 1;\n\n  echo \"Pushed subtree '$prefix' to $remote/$branch.\";\n  cleanup 0;\n}; f"
