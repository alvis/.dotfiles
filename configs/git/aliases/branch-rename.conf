[alias]
	# Rename the current branch locally and on origin.
	# GitHub origins use its branch API so pull requests and protections follow the rename.
	# Usage: git branch-rename <new-name>
	branch-rename = "!f() {\n  if [ \"$#\" -ne 1 ]; then\n    echo \"Usage: git branch-rename <new-name>\" >&2;\n    return 1;\n  fi;\n\n  new=\"$1\";\n  current=\"$(git symbolic-ref --quiet --short HEAD)\" || {\n    echo \"Cannot rename a branch while HEAD is detached.\" >&2;\n    return 1;\n  };\n\n  if [ \"$current\" = \"$new\" ]; then\n    echo \"Current branch is already named \\\"$new\\\".\";\n    return 0;\n  fi;\n\n  git check-ref-format --branch \"$new\" >/dev/null || return 1;\n  if git show-ref --verify --quiet \"refs/heads/$new\"; then\n    echo \"A local branch named \\\"$new\\\" already exists.\" >&2;\n    return 1;\n  fi;\n\n  origin_url=\"$(git remote get-url origin)\" || {\n    echo \"Remote \\\"origin\\\" is not configured.\" >&2;\n    return 1;\n  };\n\n  case \"$origin_url\" in\n    *github.com*)\n      if ! command -v gh >/dev/null 2>&1; then\n        echo \"GitHub CLI is required to rename a GitHub branch.\" >&2;\n        return 1;\n      fi;\n      if ! gh auth status >/dev/null 2>&1; then\n        echo \"GitHub CLI is not authenticated. Run: gh auth login\" >&2;\n        return 1;\n      fi;\n\n      # gh expands the documented repository and current-branch placeholders.\n      gh api --method POST \"repos/{owner}/{repo}/branches/{branch}/rename\" \\\n        -H \"Accept: application/vnd.github+json\" \\\n        -f \"new_name=$new\" >/dev/null || return 1;\n\n      git branch -m \"$new\" || {\n        echo \"The remote branch was renamed, but the local rename failed.\" >&2;\n        return 1;\n      };\n\n      remote_sha=\"$(git rev-parse --verify --quiet \"refs/remotes/origin/$current\")\";\n      if [ -n \"$remote_sha\" ]; then\n        git update-ref \"refs/remotes/origin/$new\" \"$remote_sha\" || return 1;\n        git update-ref -d \"refs/remotes/origin/$current\" || return 1;\n      fi;\n      git config \"branch.$new.remote\" origin || return 1;\n      git config \"branch.$new.merge\" \"refs/heads/$new\" || return 1;\n      ;;\n    *)\n      git branch -m \"$new\" || return 1;\n      if ! git push --set-upstream origin \"$new\"; then\n        git branch -m \"$current\";\n        return 1;\n      fi;\n      if git ls-remote --exit-code --heads origin \"$current\" >/dev/null 2>&1; then\n        git push origin --delete \"$current\" || {\n          echo \"The new branch was pushed, but origin/$current could not be deleted.\" >&2;\n          return 1;\n        };\n      fi;\n      ;;\n  esac;\n\n  echo \"Renamed branch from $current to $new (local and remote).\";\n}; f"
