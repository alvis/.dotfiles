schema = 1

[app]
id = "buku"
name = "buku"
platforms = ["macos", "linux"]
install = "pipx:buku"

[compat]
verified = true
versions = "4.x"
checked = "2026-11-20"

[sync]
strategy = "excluded"
default = false

[unsafe]
paths = ["~/.local/share/buku/bookmarks.db"]
notes = "A live SQLite database is unsafe to sync as a file. Use `buku --export bookmarks.html` and `buku --import` instead."
